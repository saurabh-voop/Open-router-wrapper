  # ---------------------------------------------------------------- document_qa
  - id: doc-01
    category: document_qa
    prompt: |
      From this tender extract, list every deadline and the payment terms.
      ---
      Last date for pre-bid queries: 28.10.2026, 17:00 hrs. Pre-bid meeting: 30.10.2026 at 11:00 hrs, Pune office.
      Bid submission: 12.11.2026 by 15:00 hrs on the e-procurement portal. Technical bid opening: 13.11.2026 at 11:00 hrs.
      Payment: 70% against delivery and inspection, 20% after successful commissioning, 10% after the defect liability period of 12 months, against an equivalent bank guarantee it may be released earlier.
      EMD: INR 2,50,000 via BG valid for 180 days from bid due date.
  - id: doc-02
    category: document_qa
    prompt: |
      Does this AMC clause make us liable for consumables? Answer yes/no and quote the relevant text.
      ---
      4.2 The Contractor shall carry out preventive maintenance every 250 running hours or quarterly, whichever is earlier. 4.3 Lubricating oil, filters and coolant required for preventive maintenance shall be supplied by the Contractor at no extra cost. 4.4 Spares other than those listed in Annexure B shall be charged at actuals with a 10% handling charge.
  - id: doc-03
    category: document_qa
    prompt: |
      Summarise the warranty terms in 3 bullet points and flag anything unusual.
      ---
      Warranty: 24 months from date of commissioning or 30 months from date of supply, whichever is earlier, or 5000 running hours, whichever occurs first. Warranty excludes damage due to poor fuel quality, overloading beyond 110% for more than 1 hour in 12, and civil works. The Purchaser's decision on the cause of failure shall be final.
  - id: doc-04
    category: document_qa
    prompt: |
      Compare these two quotations and tell me which is better value for a 625 kVA requirement.
      ---
      Quote A: 625 kVA, CPCB IV+, acoustic enclosure, AMF panel, INR 54.2 lakh ex-works, freight extra, 18 months warranty, delivery 8 weeks.
      Quote B: 600 kVA, CPCB IV+, acoustic enclosure, AMF panel + synchronising, INR 52.9 lakh FOR site, 24 months warranty, delivery 12 weeks.
  - id: doc-05
    category: document_qa
    prompt: |
      Extract the technical specification as a table (parameter, value).
      ---
      The DG set shall be rated 1010 kVA prime power at 415 V, 3 phase, 50 Hz, 0.8 PF, 1500 RPM, with a 4-pole brushless alternator of class H insulation, temperature rise limited to class F. Fuel tank: 990 litres integral. Noise: 75 dB(A) at 1 m. Controller: microprocessor-based with remote monitoring over Modbus RS485.
  - id: doc-06
    category: document_qa
    prompt: |
      What are the penalties in this contract and what is our maximum exposure on a INR 1.8 cr order?
      ---
      LD for delay: 0.5% of order value per week of delay, max 10%. Performance shortfall: if fuel consumption at 75% load exceeds the guaranteed value by more than 5%, a penalty of INR 1,00,000 per 1% excess applies, capped at 5% of order value. Availability below 98% in any quarter attracts a penalty of 2% of the quarterly AMC fee per 1% shortfall.
  - id: doc-07
    category: document_qa
    prompt: |
      Is anything in this purchase order inconsistent with our quotation?
      ---
      Our quote: 2 x 380 kVA, INR 28.4 lakh each, delivery 6 weeks, payment 30% advance, 70% before dispatch.
      PO: 2 x 380 kVA, INR 28.4 lakh each, delivery 4 weeks, payment 10% advance, 90% within 60 days of commissioning, LD 1% per week.
  - id: doc-08
    category: document_qa
    prompt: |
      List the documents we must submit with this bid.
      ---
      The bidder shall submit: (i) PAN and GST registration; (ii) audited balance sheets for the last three financial years showing average annual turnover not less than INR 5 crore; (iii) at least two completion certificates for similar works of 500 kVA or above in the last five years; (iv) OEM authorisation letter; (v) EMD BG; (vi) signed integrity pact; (vii) MSME certificate, if claiming exemption.
  - id: doc-09
    category: document_qa
    prompt: |
      Explain this force majeure clause in plain English and say whether it covers a supplier's engine shortage.
      ---
      Neither party shall be liable for failure to perform due to causes beyond its reasonable control, including acts of God, war, epidemic, government action, or strikes not limited to the affected party's own workforce, provided notice is given within 7 days. Shortage of materials or components shall not constitute force majeure unless caused by one of the foregoing events.
  - id: doc-10
    category: document_qa
    prompt: |
      Pull out all the contact people and their roles from this email thread.
      ---
      From: R. Deshmukh (Procurement Head, Thermax) - "Please coordinate with Ms. Anjali Rao, our site engineer at Chakan, for the delivery schedule. Accounts queries go to Mr. Vikas Jain (Finance)." Reply from: Neha Kulkarni (Sales Coordinator, our side) - "Copying our service lead Sanjay Pawar who will handle commissioning."

  # ---------------------------------------------------------------- writing
  - id: write-01
    category: writing
    prompt: "Write a polite but firm follow-up email to Hindalco's procurement team: our quotation for 2 x 750 kVA gensets was sent 3 weeks ago and the validity expires on 31 October. Keep it under 150 words."
  - id: write-02
    category: writing
    prompt: "Rewrite this to sound more professional: 'hi sir, we will send the panel next week only because material is late from vendor. sorry for trouble. pls adjust.'"
  - id: write-03
    category: writing
    prompt: "Translate into Marathi, keeping technical terms in English: 'The generator will be serviced on Saturday between 10 am and 2 pm. Please ensure the site is accessible and the load is shifted to mains.'"
  - id: write-04
    category: writing
    prompt: "Draft a one-page proposal introduction for an AMC offering to a hospital with 3 gensets (500, 500, 250 kVA): emphasise uptime, 4-hour response, and monthly reports."
  - id: write-05
    category: writing
    prompt: "Write a LinkedIn post (about 120 words) announcing that we commissioned a 2 MW synchronised genset system for a data centre in Pune. Professional, not salesy."
  - id: write-06
    category: writing
    prompt: "A customer is angry that our technician arrived 6 hours late during an outage. Write an apology email that takes responsibility, explains the corrective steps, and offers a goodwill gesture."
  - id: write-07
    category: writing
    prompt: "Make this email shorter and more direct: 'Dear Sir, I hope this email finds you well. As discussed in our telephonic conversation earlier this week, I am writing to kindly request you to please share the updated load list for the new plant at your earliest convenience so that our engineering team can proceed with the sizing of the generator set, which is required for us to finalise the quotation.'"
  - id: write-08
    category: writing
    prompt: "Translate into Hindi for a customer WhatsApp message: 'Your AMC is due for renewal on 15 November. Renew before 31 October to get 5% off and a free load bank test.'"
  - id: write-09
    category: writing
    prompt: "Write a short internal note to the sales team explaining the new rule: discounts above 5% need the regional manager's approval in the CRM before the quote is sent."
  - id: write-10
    category: writing
    prompt: "Draft a reply declining a customer's request for 90-day credit, offering 30 days instead with a 1% early-payment discount. Keep the relationship warm."

  # ---------------------------------------------------------------- reasoning
  - id: reason-01
    category: reasoning
    prompt: "Plan a 6-week rollout for a new AMC offering across 4 regional offices: week-by-week steps, owners, and the key risks."
  - id: reason-02
    category: reasoning
    prompt: "Is this pricing model profitable? We sell AMC at INR 85,000 per genset per year. Each genset needs 4 visits (INR 6,500 each incl. travel), consumables INR 18,000, and on average INR 22,000 of breakdown support. Overheads are 12% of revenue. At 40 contracts, what is our profit and margin? What price gives 25% margin?"
  - id: reason-03
    category: reasoning
    prompt: "A customer needs backup for a 420 kW load with a 150 kW motor that starts direct-on-line. How would you size the genset? Walk through the reasoning and state assumptions."
  - id: reason-04
    category: reasoning
    prompt: "We can either hire 2 more service technicians (INR 6 lakh/year each) or outsource overflow jobs at INR 9,000 per visit. We expect 180 overflow visits next year with 30% uncertainty. Which is better and when does the decision flip?"
  - id: reason-05
    category: reasoning
    prompt: "Should we bid on a government tender with 0.5% weekly LD (max 10%), 90-day payment terms, and a 12% expected margin, given our working capital cost is 11% per year? Lay out the trade-offs."
  - id: reason-06
    category: reasoning
    prompt: "Three customers want delivery in the same week but we can only deliver two gensets. Customer A: repeat client, INR 40 lakh, LD 1%/week. Customer B: new, INR 55 lakh, no LD. Customer C: government, INR 35 lakh, LD 0.5%/week, payment in 90 days. How do we prioritise?"
  - id: reason-07
    category: reasoning
    prompt: "Design a simple lead-scoring scheme (0-100) for our genset enquiries using information we usually have at first contact. Explain the weights."
  - id: reason-08
    category: reasoning
    prompt: "If our win rate is 22% and average deal size INR 31 lakh, how many qualified leads per month do we need to hit INR 2.5 cr monthly bookings? How would improving win rate to 27% change that?"
  - id: reason-09
    category: reasoning
    prompt: "What questions should a salesperson ask on a first site visit for a data-centre backup power requirement? Group them by topic."
  - id: reason-10
    category: reasoning
    prompt: "A hospital asks whether to buy one 1000 kVA genset or two 500 kVA in parallel. Give a balanced recommendation covering reliability, cost, maintenance and space."

