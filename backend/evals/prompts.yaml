# Seed eval set (TASKS Phase 4): 10 realistic prompts per category for an industrial
# sales team (gensets, panels, AMC, tenders, client emails, CSV analysis, code).
# The team should add at least 50 real prompts. Each item: id, category (the expected
# category, used only for reporting), prompt. Data the prompt needs is inlined.
version: 1
prompts:
  # ---------------------------------------------------------------- coding
  - id: code-01
    category: coding
    prompt: "Write a Python function that parses Indian GST numbers (GSTIN), validates the format and checksum, and returns the state code. Include tests."
  - id: code-02
    category: coding
    prompt: |
      This FastAPI endpoint returns 422 when the frontend posts the form. Why, and how do I fix it?
      ```python
      @app.post("/quotes")
      async def create_quote(customer: str, kva: int, qty: int):
          return {"total": kva * qty * 1850}
      ```
      The frontend sends JSON: {"customer": "Hindalco", "kva": 500, "qty": 2}
  - id: code-03
    category: coding
    prompt: "Write a PostgreSQL query that gives monthly revenue per customer for the last 12 months from tables invoices(id, customer_id, issued_on date, amount numeric) and customers(id, name), including months with zero revenue."
  - id: code-04
    category: coding
    prompt: "Give me a regex that matches our quotation numbers like PK/Q/2026-27/0457 and PK/Q/2025-26/12, and captures the financial year and the sequence number. Explain each part."
  - id: code-05
    category: coding
    prompt: "Write a Google Apps Script that runs daily, finds rows in the 'AMC' sheet where the renewal date is within 30 days, and emails a summary to sales@ourcompany.in."
  - id: code-06
    category: coding
    prompt: "Review this code for bugs and security problems:\n```python\ndef get_tender(request):\n    tid = request.GET['id']\n    rows = db.execute(f\"SELECT * FROM tenders WHERE id = {tid}\")\n    return render(request, 'tender.html', {'t': rows[0]})\n```"
  - id: code-07
    category: coding
    prompt: "Write a bash script that backs up a Postgres database to a gzipped file named with today's date, keeps the last 14 backups, and uploads the newest to an S3 bucket."
  - id: code-08
    category: coding
    prompt: "Explain the difference between asyncio.gather and asyncio.TaskGroup in Python 3.12, with an example where they behave differently on errors."
  - id: code-09
    category: coding
    prompt: "Convert this Excel formula to pandas: =SUMIFS(D:D, A:A, \"Pune\", C:C, \">=\"&DATE(2026,4,1)) where A is branch, C is invoice date, D is amount."
  - id: code-10
    category: coding
    prompt: "Write a TypeScript type and a zod schema for a genset quotation line item: model, kVA rating (15 to 3000), fuel type (diesel/gas/dual), quantity, unit price in INR, optional AMC years (1-5)."

