# Development stack. Production overrides live in docker-compose.prod.yml (Phase 9).
#
#   cp .env.example .env    # fill OPENROUTER_API_KEY, SANDBOX_TOKEN
#   docker compose up --build
#
# Web on http://localhost:3000, API on http://localhost:8000.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: relay
      POSTGRES_PASSWORD: relay
      POSTGRES_DB: relay
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relay"]
      interval: 5s
      retries: 10

  # S3 stand-in for development (SPEC 8.2): moto's S3 server, in memory, so files are
  # lost when it restarts. Production uses AWS S3 in ap-south-1.
  s3:
    image: motoserver/moto:5.1.4
    ports: ["5000:5000"]

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://relay:relay@db:5432/relay
      ROUTING_CONFIG_PATH: /app/config/routing.yaml
      CONNECTORS_CONFIG_PATH: /app/config/connectors.yaml
      S3_ENDPOINT_URL: http://s3:5000
      S3_BUCKET: relay-files
      AWS_ACCESS_KEY_ID: dev
      AWS_SECRET_ACCESS_KEY: dev
      SANDBOX_URL: http://sandbox:8100
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
      s3: {condition: service_started}

  web:
    build:
      context: frontend
      args:
        API_INTERNAL_URL: http://api:8000
    ports: ["3000:3000"]
    depends_on: [api]

  # Gmail/Drive connector (SPEC 8.4, docs/CONNECTORS.md): taylorwilsdon/google_workspace_mcp
  # built from a pinned commit, external-OAuth stateless mode. Relay sends each user's
  # short-lived Google access token per request; the server stores nothing on disk.
  workspace-mcp:
    build: https://github.com/taylorwilsdon/google_workspace_mcp.git#301151aec23b672f6ca2067451cd4f9f6e34cc41
    environment:
      MCP_ENABLE_OAUTH21: "true"
      EXTERNAL_OAUTH21_PROVIDER: "true"
      WORKSPACE_MCP_STATELESS_MODE: "true"
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      TOOLS: "drive gmail"
      WORKSPACE_MCP_DISABLED_TOOLS: "start_google_auth,get_drive_file_download_url,get_gmail_attachment_content"
      WORKSPACE_MCP_TOKEN_VALIDATION_CACHE_TTL: "300"

  # --- code execution (SPEC 8.3) -------------------------------------------------------
  # Builds the per-job image; the container itself exits immediately.
  sandbox-runtime:
    image: relay-sandbox-runtime:1
    build: sandbox/runtime
    entrypoint: ["python", "-c", "pass"]
    network_mode: none
    restart: "no"

  # The only thing with the Docker socket. It exposes container endpoints only
  # (no images, exec, volumes API, networks, swarm). Reachable only from `sandbox`.
  sandbox-proxy:
    image: tecnativa/docker-socket-proxy:v0.4.2
    environment:
      CONTAINERS: 1
      POST: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [sandbox_ctl]

  sandbox:
    build: sandbox
    env_file:
      - path: .env
        required: false
    environment:
      DOCKER_HOST: tcp://sandbox-proxy:2375
      SANDBOX_IMAGE: relay-sandbox-runtime:1
      # SANDBOX_RUNTIME: runsc   # enable when gVisor is installed on the host
    depends_on:
      sandbox-proxy: {condition: service_started}
      sandbox-runtime: {condition: service_completed_successfully}
    networks: [default, sandbox_ctl]

networks:
  sandbox_ctl:
    internal: true

volumes:
  pgdata:
